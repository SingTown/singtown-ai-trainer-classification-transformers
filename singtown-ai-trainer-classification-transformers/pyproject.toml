[project]
name = "singtown-ai-trainer-classification-transformers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets[vision]>=4.4.1",
    "onnx>=1.20.0",
    "onnxscript>=0.5.6",
    "singtown-ai>=1.10.1",
    "timm>=1.0.22",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers[torch]>=4.57.3",
]

# Linux x86_64 gets the CUDA build, which also runs on a machine without a GPU.
# Every other platform (macOS for development, arm64) keeps the CPU build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
